name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag (for example v0.1.32)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package one Mac app for Apple Silicon and Intel
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          npx @electron/packager . DeskBuddy --platform=darwin --arch=universal --out=dist --overwrite --app-bundle-id=com.kssemy.deskbuddy
          ditto -c -k --sequesterRsrc --keepParent "dist/DeskBuddy-darwin-universal/DeskBuddy.app" "DeskBuddy-Mac-$version.zip"
      - name: Upload macOS apps to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" DeskBuddy-Mac-*.zip --clobber
