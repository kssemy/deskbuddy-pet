<!doctype html><html lang="ko"><meta charset="utf-8"><title>이번 달 한 일</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#49362d;font:11px system-ui,sans-serif}#card{height:calc(100% - 16px);margin:8px;padding:12px;border-radius:17px;background:#fffaf5;opacity:var(--bubble-opacity,1);display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px}h1{font-size:15px;margin:0}button{border:0;border-radius:6px;background:#ffe6ac;color:#49362d;cursor:pointer;font:inherit;padding:4px 7px}#total{margin-left:auto}#close{background:transparent;font-size:18px}#week,#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#week{margin:10px 0 4px;text-align:center;color:#8b7162}#calendar{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}.day{min-width:0;padding:5px;border:1px solid #ead9ca;border-radius:7px;background:#fffdf9;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}.day:hover,.day.selected{border-color:#c6a37e;background:#fff7e8}.day strong{font-size:11px}.day .tasks{flex:1;min-height:0;overflow:hidden;margin-top:3px}.day .tasks div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.day .hours{color:#967458;font-size:10px;margin-top:2px}#detail{border-top:1px solid #d9c7b9;margin-top:8px;padding-top:6px;min-height:65px;max-height:95px;overflow-y:auto}#detail h2{font-size:12px;margin:0 0 4px}#detail ul{margin:0;padding-left:18px}#detail li{margin:2px 0}
</style>
<div id="card"><header><button id="prev" title="이전 달">‹</button><h1 id="month"></h1><button id="next" title="다음 달">›</button><strong id="total"></strong><button id="close" aria-label="닫기">×</button></header><div id="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar"></div><div id="detail"><h2>날짜를 누르면 할 일 전체를 볼 수 있어요.</h2></div></div>
<script>
let shown=new Date(),selected=null;
const format=minutes=>`${Math.floor(minutes/60)}시간 ${minutes%60}분`;
async function render(){
 const year=shown.getFullYear(),month=shown.getMonth()+1,data=await window.pet.historyMonth(year,month);if(!data)return;
 document.querySelector('#month').textContent=`${year}년 ${month}월`;
 document.querySelector('#total').textContent=`이번 달 총 ${format(data.total)}`;
 const calendar=document.querySelector('#calendar');calendar.replaceChildren();
 for(let i=0;i<new Date(year,month-1,1).getDay();i++)calendar.append(document.createElement('div'));
 for(const day of data.days){const cell=document.createElement('div');cell.className='day'+(selected===day.key?' selected':'');cell.tabIndex=0;cell.setAttribute('role','button');cell.setAttribute('aria-label',`${month}월 ${day.day}일, ${day.tasks.length}개 할 일, ${format(day.minutes)}`);
  const number=document.createElement('strong');number.textContent=day.day;const tasks=document.createElement('div');tasks.className='tasks';
  for(const task of day.tasks.slice(0,3)){const line=document.createElement('div');line.textContent=(task.done?'✓ ':'□ ')+task.text;tasks.append(line)}
  if(day.tasks.length>3){const more=document.createElement('div');more.textContent=`외 ${day.tasks.length-3}개`;tasks.append(more)}
  const hours=document.createElement('div');hours.className='hours';hours.textContent=day.minutes?format(day.minutes):'';cell.append(number,tasks,hours);
  const open=()=>{selected=day.key;document.querySelectorAll('.day').forEach(item=>item.classList.toggle('selected',item===cell));const detail=document.querySelector('#detail');detail.replaceChildren();const title=document.createElement('h2');title.textContent=`${month}월 ${day.day}일 · 근무 ${format(day.minutes)}`;detail.append(title);const list=document.createElement('ul');for(const task of day.tasks){const item=document.createElement('li');item.textContent=(task.done?'✓ ':'□ ')+task.text;list.append(item)}if(!day.tasks.length){const item=document.createElement('li');item.textContent='기록된 할 일이 없어요.';list.append(item)}detail.append(list)};
  cell.addEventListener('click',open);cell.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}});calendar.append(cell)
 }
}
window.pet.load().then(data=>{document.documentElement.style.setProperty('--bubble-opacity',Number(data.bubbleOpacity??100)/100);render()});
document.querySelector('#prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);selected=null;render()};
document.querySelector('#next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);selected=null;render()};
document.querySelector('#close').onclick=()=>window.close();
document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
</script></html>
