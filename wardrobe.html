<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 옷장</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#49362d;font:12px system-ui,sans-serif}#card{height:calc(100% - 16px);margin:8px;padding:12px;border-radius:17px;background:#fffaf5;opacity:var(--bubble-opacity,1);display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px}h1{font-size:15px;margin:0}button{border:0;border-radius:7px;background:#ffe6ac;color:#49362d;cursor:pointer;font:inherit;padding:5px 7px}button:disabled{opacity:.4;cursor:default}#close{margin-left:auto;background:transparent;font-size:18px}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;overflow-y:auto;flex:1;min-height:0;align-content:start}.tile,.pose{position:relative;min-width:0;aspect-ratio:1;background:#fffdf9;border:1px solid #ead9ca;border-radius:9px}.tile.active{border:2px solid #db9b52;background:#fff0d1}.select{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:transparent;padding:5px}.select img{width:100%;height:calc(100% - 17px);object-fit:contain}.select span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.delete{position:absolute;right:3px;top:3px;width:20px;height:20px;padding:0;border-radius:50%;background:#fffaf5;font-size:16px;line-height:18px}#poseSection{border-top:1px solid #ead9ca;margin-top:8px;padding-top:8px;flex:none}#poseSection header{justify-content:space-between}#poseSection h2{font-size:12px;margin:0}#poseSpeed{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px}#poseSpeed button{width:22px;height:22px;padding:0;font-size:16px;line-height:20px}#speedValue{min-width:74px;text-align:center}#poseGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:180px;overflow-y:auto;margin-top:7px}.pose img{width:100%;height:100%;object-fit:contain;padding:5px}#empty{font-size:11px;color:#956b4f}#status{min-height:16px;margin:5px 0 0;color:#956b4f}
</style>
<div id="card"><header><h1>캐릭터 옷장</h1><button id="upload" type="button">캐릭터 PNG 등록</button><button id="close" type="button" aria-label="닫기">×</button></header><div id="grid"></div><section id="poseSection"><header><h2 id="poseTitle"></h2><button id="addPoses" type="button">+ 동작 PNG</button></header><div id="poseSpeed"><span>동작 속도</span><button id="slower" type="button" title="느리게" aria-label="동작 느리게">−</button><span id="speedValue"></span><button id="faster" type="button" title="빠르게" aria-label="동작 빠르게">+</button></div><div id="poseGrid"></div><p id="empty" hidden>등록된 동작 PNG가 없어요.</p></section><p id="status" role="status"></p></div>
<script>
let selectedId=null;
function render(data){
 document.documentElement.style.setProperty('--bubble-opacity',Number(data.bubbleOpacity??100)/100);
 const wardrobe=data.wardrobe||[];
 if(!wardrobe.some(item=>item.id===selectedId))selectedId=data.currentCharacterId;
 const grid=document.querySelector('#grid');grid.replaceChildren();
 for(const item of wardrobe){
  const tile=document.createElement('div'),select=document.createElement('button'),img=document.createElement('img'),label=document.createElement('span');
  tile.className='tile'+(item.id===selectedId?' active':'');select.className='select';select.type='button';select.title=item.label;img.src=item.url;img.alt='';label.textContent=item.label;select.append(img,label);
  select.onclick=async()=>{selectedId=item.id;try{render(await window.pet.activateCharacter(item.id));document.querySelector('#status').textContent='캐릭터를 바꿨어요.'}catch(error){document.querySelector('#status').textContent=error.message}};
  tile.append(select);
  if(item.id!=='default'){const remove=document.createElement('button');remove.className='delete';remove.type='button';remove.textContent='×';remove.title=item.label+' 삭제';remove.setAttribute('aria-label',item.label+' 삭제');remove.onclick=async()=>{try{if(selectedId===item.id)selectedId=null;render(await window.pet.deleteCharacter(item.id));document.querySelector('#status').textContent='옷장에서 삭제했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};tile.append(remove)}
  grid.append(tile);
 }
 const selected=wardrobe.find(item=>item.id===selectedId);
 document.querySelector('#poseTitle').textContent=(selected?.label||'캐릭터')+' · 동작 PNG';
 const seconds=selected?.poseIntervalSeconds||8;document.querySelector('#speedValue').textContent=(13-seconds)+'/11 · '+seconds+'초';document.querySelector('#slower').disabled=seconds>=12;document.querySelector('#faster').disabled=seconds<=2;
 const poseGrid=document.querySelector('#poseGrid');poseGrid.replaceChildren();
 for(const [index,pose] of (selected?.poses||[]).entries()){
  const tile=document.createElement('div'),img=document.createElement('img'),remove=document.createElement('button');tile.className='pose';img.src=pose.url;img.alt='동작 '+(index+1);remove.className='delete';remove.type='button';remove.textContent='×';remove.title='동작 '+(index+1)+' 삭제';remove.setAttribute('aria-label',remove.title);
  remove.onclick=async()=>{try{render(await window.pet.removePose(selectedId,pose.name));document.querySelector('#status').textContent='동작 PNG를 삭제했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};tile.append(img,remove);poseGrid.append(tile);
 }
 document.querySelector('#empty').hidden=!!(selected?.poses||[]).length;
}
window.pet.load().then(render);window.pet.onChange(render);
document.querySelector('#upload').onclick=async()=>{try{const data=await window.pet.chooseImage();selectedId=data.currentCharacterId;render(data);document.querySelector('#status').textContent='옷장에 추가했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};
document.querySelector('#addPoses').onclick=async()=>{try{render(await window.pet.addPoses(selectedId));document.querySelector('#status').textContent='동작 PNG를 추가했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};
for(const [button,direction] of [['slower',-1],['faster',1]])document.querySelector('#'+button).onclick=async()=>{try{render(await window.pet.setPoseSpeed(selectedId,direction))}catch(error){document.querySelector('#status').textContent=error.message}};
document.querySelector('#close').onclick=()=>window.close();document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
</script></html>
