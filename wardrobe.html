<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 옷장</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#49362d;font:12px system-ui,sans-serif}#card{height:calc(100% - 16px);margin:8px;padding:12px;border-radius:17px;background:#fffaf5;opacity:var(--bubble-opacity,1);display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px}h1{font-size:15px;margin:0}button{border:0;border-radius:7px;background:#ffe6ac;color:#49362d;cursor:pointer;font:inherit;padding:5px 7px}#close{margin-left:auto;background:transparent;font-size:18px}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;overflow-y:auto}.tile{position:relative;min-width:0;aspect-ratio:1;background:#fffdf9;border:1px solid #ead9ca;border-radius:9px}.tile.active{border:2px solid #db9b52;background:#fff0d1}.select{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:transparent;padding:5px}.select img{width:100%;height:calc(100% - 17px);object-fit:contain}.select span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.delete{position:absolute;right:3px;top:3px;width:20px;height:20px;padding:0;border-radius:50%;background:#fffaf5;font-size:16px;line-height:18px}#status{min-height:16px;margin:5px 0 0;color:#956b4f}
</style>
<div id="card"><header><h1>캐릭터 옷장</h1><button id="upload" type="button">PNG 추가</button><button id="close" type="button" aria-label="닫기">×</button></header><div id="grid"></div><p id="status" role="status"></p></div>
<script>
function render(data){document.documentElement.style.setProperty('--bubble-opacity',Number(data.bubbleOpacity??100)/100);const grid=document.querySelector('#grid');grid.replaceChildren();for(const item of data.wardrobe||[]){const tile=document.createElement('div'),select=document.createElement('button'),img=document.createElement('img'),label=document.createElement('span');tile.className='tile'+(item.active?' active':'');select.className='select';select.type='button';select.title=item.label;img.src=item.url;img.alt='';label.textContent=item.label;select.append(img,label);select.onclick=async()=>{try{render(await window.pet.activateCharacter(item.id));document.querySelector('#status').textContent='캐릭터를 바꿨어요.'}catch(error){document.querySelector('#status').textContent=error.message}};tile.append(select);if(item.id!=='default'){const remove=document.createElement('button');remove.className='delete';remove.type='button';remove.textContent='×';remove.title=item.label+' 삭제';remove.setAttribute('aria-label',item.label+' 삭제');remove.onclick=async()=>{try{render(await window.pet.deleteCharacter(item.id));document.querySelector('#status').textContent='옷장에서 삭제했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};tile.append(remove)}grid.append(tile)}}
window.pet.load().then(render);window.pet.onChange(render);
document.querySelector('#upload').onclick=async()=>{try{render(await window.pet.chooseImage());document.querySelector('#status').textContent='옷장에 추가했어요.'}catch(error){document.querySelector('#status').textContent=error.message}};
document.querySelector('#close').onclick=()=>window.close();document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
</script></html>
