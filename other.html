<!doctype html><html lang="ko"><meta charset="utf-8"><title>함께 일하는 캐릭터</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:190px;height:400px;overflow:hidden;background:transparent;color:#4f3b31;font:11px/1.3 sans-serif;user-select:none}
#other{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;cursor:default}
#avatar,#fallback{width:var(--size,130px);height:var(--size,130px);object-fit:contain;cursor:grab}
#speech{max-width:170px;max-height:65px;padding:5px 7px;border-radius:10px;background:#fffaf5;overflow:hidden;overflow-wrap:anywhere}
#speech.popping{position:relative;overflow:visible;animation:friendPop .5s ease-out forwards}
#speech.popping:after{content:'💥';position:absolute;left:50%;top:50%;font-size:22px;animation:burst .5s ease-out forwards}
@keyframes friendPop{40%{transform:scale(1.15)}100%{transform:scale(.5);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
#avatar{animation:float 2s ease-in-out infinite}
#other.glowing #avatar,#other.glowing #fallback{filter:brightness(1.35) drop-shadow(0 0 8px #fff9cb) drop-shadow(0 0 17px #ffe156) drop-shadow(0 0 28px #ffae24)}
#other.shaking #avatar,#other.shaking #fallback{animation:shake .24s linear 1}
#other.highfive:after{content:'🙌';position:absolute;bottom:calc(var(--size,130px) + 45px);left:50%;transform:translateX(-50%);font-size:26px;pointer-events:none;animation:highfive 1.2s ease-out forwards}
@keyframes highfive{to{opacity:0;transform:translate(-50%,-28px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fallback{animation:float 2s ease-in-out infinite}
#status{max-width:185px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todo{position:absolute;left:8px;right:8px;bottom:calc(var(--size,130px) + 31px + var(--speech-height,0px));max-height:150px;padding:10px;border-radius:14px;background:#fffaf5;overflow:auto}
#todo h2{font-size:13px;margin:0 0 8px}#todo ul{padding-left:18px;margin:0}#todo li{margin:5px 0;overflow-wrap:anywhere}
[hidden]{display:none!important}@keyframes float{50%{transform:translateY(-4px) rotate(1deg)}}
</style>
<div id="other"><div id="speech" hidden></div><img id="avatar" alt="" draggable="false" hidden><img id="fallback" src="default-character.png" alt="친구 캐릭터" draggable="false"><div id="status"></div><div id="todo" hidden><h2>공개 TO DO</h2><ul></ul></div></div>
<script>
let baseAvatar='',friendPoses=[],friendPoseIndex=0,friendPoseActive=false,remoteExpiresAt=0;
window.pet.onRemote(data=>{
 document.documentElement.style.setProperty('--size',`${data.displaySize||130}px`);
 const avatar=document.querySelector('#avatar'),valid=typeof data.avatar==='string'&&data.avatar.startsWith('data:image/png;base64,');
 avatar.hidden=!valid;document.querySelector('#fallback').hidden=valid;
 if(valid&&baseAvatar!==data.avatar){baseAvatar=data.avatar;if(!friendPoseActive)avatar.src=baseAvatar}
 document.querySelector('#status').textContent=data.status||'';
 const speech=document.querySelector('#speech'),expiresAt=data.public_tasks?.find(task=>task.type==='speech-expiry')?.expiresAt||0;
 if(remoteExpiresAt!==expiresAt)speech.classList.remove('popping');remoteExpiresAt=expiresAt;
 speech.textContent=data.speech||'';speech.hidden=!data.speech;
 document.documentElement.style.setProperty('--speech-height',speech.hidden?'0px':(speech.offsetHeight+6)+'px');
 const list=document.querySelector('#todo ul');list.replaceChildren();
 for(const task of Array.isArray(data.public_tasks)?data.public_tasks:[]){if(task.type)continue;const li=document.createElement('li');li.textContent=(task.done?'✓ ':'□ ')+String(task.text||'');list.append(li)}
 if(!list.children.length){const li=document.createElement('li');li.textContent='공개된 할 일이 없어요.';list.append(li)}
 reportTodoBounds();
});
setInterval(()=>{if(remoteExpiresAt&&Date.now()>=remoteExpiresAt)document.querySelector('#speech').classList.add('popping')},200);
window.pet.onRemotePoses(poses=>{friendPoses=Array.isArray(poses)?poses.filter(image=>typeof image==='string'&&image.startsWith('data:image/png;base64,')):[];friendPoseIndex=0});
setInterval(()=>{if(!baseAvatar||!friendPoses.length)return;const avatar=document.querySelector('#avatar');friendPoseActive=true;avatar.src=friendPoses[friendPoseIndex++%friendPoses.length];setTimeout(()=>{friendPoseActive=false;avatar.src=baseAvatar},1800)},8000);
window.pet.onRemoteSize(size=>{document.documentElement.style.setProperty('--size',`${size}px`);reportTodoBounds()});
const other=document.querySelector('#other');
let last=null,moved=false;
document.addEventListener('dragstart',event=>event.preventDefault());
function reportTodoBounds(){const todo=document.querySelector('#todo');window.pet.remoteTodoBounds(todo.hidden?null:{left:todo.offsetLeft,right:todo.offsetLeft+todo.offsetWidth,top:todo.offsetTop,bottom:todo.offsetTop+todo.offsetHeight})}
other.addEventListener('pointermove',event=>{
 if(!last)return;
 const dx=event.screenX-last.x,dy=event.screenY-last.y;
 if(Math.abs(dx)+Math.abs(dy)>6){moved=true;window.pet.dragRemote(dx,dy)}
});
other.addEventListener('pointerdown',event=>{
 moved=false;
 if(event.button!==0||!event.target.closest('#avatar:not([hidden]),#fallback:not([hidden])'))return;
 last={x:event.screenX,y:event.screenY};other.setPointerCapture(event.pointerId);window.pet.remoteDragState(true);
});
let clicks=0,clickTimer;
function endDrag(event){
 if(!last)return;
 const wasClick=!moved&&event.type==='pointerup';
 last=null;window.pet.remoteDragState(false);
 if(wasClick){
  const todo=document.querySelector('#todo');todo.hidden=!todo.hidden;
  reportTodoBounds();
  clicks++;clearTimeout(clickTimer);clickTimer=setTimeout(()=>clicks=0,800);
  if(clicks>=3){clicks=0;window.pet.pokeFriend()}
 }
}
other.addEventListener('pointerup',endDrag);
other.addEventListener('pointercancel',endDrag);
window.pet.onReaction(value=>{const name=value==='glow'?'glowing':value==='highfive'?'highfive':'shaking';other.classList.remove(name);void other.offsetWidth;other.classList.add(name);setTimeout(()=>other.classList.remove(name),1200)});
</script></html>
