<!doctype html><html lang="ko"><meta charset="utf-8"><title>함께 일하는 캐릭터</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:190px;height:400px;overflow:hidden;background:transparent;color:#4f3b31;font:11px/1.3 sans-serif;user-select:none}
#other{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;cursor:default}
#speech{max-width:170px;max-height:65px;padding:5px 7px;border-radius:10px;background:#fffaf5;overflow:hidden;overflow-wrap:anywhere}
#avatar{width:120px;height:120px;object-fit:contain;animation:float 2s ease-in-out infinite}
#fallback{font-size:100px;line-height:1;animation:float 2s ease-in-out infinite}
#status{max-width:185px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todo{position:absolute;left:8px;right:8px;bottom:calc(151px + var(--speech-height,0px));max-height:150px;padding:10px;border-radius:14px;background:#fffaf5;overflow:auto}
#todo h2{font-size:13px;margin:0 0 8px}#todo ul{padding-left:18px;margin:0}#todo li{margin:5px 0;overflow-wrap:anywhere}
[hidden]{display:none!important}@keyframes float{50%{transform:translateY(-4px) rotate(1deg)}}
</style>
<div id="other"><div id="speech" hidden></div><img id="avatar" alt="" hidden><div id="fallback">🐻</div><div id="status"></div><div id="todo" hidden><h2>공개 TO DO · 더블클릭해서 닫기</h2><ul></ul></div></div>
<script>
window.pet.onRemote(data=>{
 const avatar=document.querySelector('#avatar'),valid=typeof data.avatar==='string'&&data.avatar.startsWith('data:image/png;base64,');
 avatar.hidden=!valid;document.querySelector('#fallback').hidden=valid;
 if(valid&&avatar.src!==data.avatar)avatar.src=data.avatar;
 document.querySelector('#status').textContent=data.status||'';
 const speech=document.querySelector('#speech');speech.textContent=data.speech||'';speech.hidden=!data.speech;
 document.documentElement.style.setProperty('--speech-height',speech.hidden?'0px':(speech.offsetHeight+6)+'px');
 const list=document.querySelector('#todo ul');list.replaceChildren();
 for(const task of Array.isArray(data.public_tasks)?data.public_tasks:[]){const li=document.createElement('li');li.textContent=(task.done?'✓ ':'□ ')+String(task.text||'');list.append(li)}
 if(!list.children.length){const li=document.createElement('li');li.textContent='공개된 할 일이 없어요.';list.append(li)}
});
document.querySelector('#other').addEventListener('dblclick',()=>{const todo=document.querySelector('#todo');todo.hidden=!todo.hidden});
</script></html>
