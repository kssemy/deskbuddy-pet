<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}body{display:flex;gap:4px}button{width:28px;height:28px;border:0;border-radius:50%;background:#fffaf5;color:#806b59;opacity:.65;cursor:pointer;font:18px sans-serif}button:hover{opacity:1}</style><button id="refresh" title="캐릭터 맨 위로 갱신" aria-label="캐릭터 맨 위로 갱신">↥</button><button id="home" title="캐릭터 모으기 · 다시 누르면 원래 위치" aria-label="캐릭터 모으기">🏠</button><script>document.querySelector('#refresh').onclick=()=>window.pet.refreshTop();document.querySelector('#home').onclick=()=>window.pet.arrangeHome()</script></html>
