<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}body{display:flex;gap:4px;padding:2px}button{flex:0 0 28px;width:28px;height:28px;min-width:0;min-height:0;padding:0;border:0;border-radius:50%;background:#fffaf5;color:#806b59;opacity:.65;cursor:pointer;font:18px/28px sans-serif}button:hover{opacity:1}</style><button id="refresh" title="캐릭터 맨 위로 갱신" aria-label="캐릭터 맨 위로 갱신">↥</button><button id="home" title="캐릭터 모으기 · 다시 누르면 원래 위치" aria-label="캐릭터 모으기">🏠</button><script>document.querySelector('#refresh').onclick=()=>window.pet.refreshTop();document.querySelector('#home').onclick=()=>window.pet.arrangeHome()</script></html>
