<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일하는 캐릭터</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 240px; height: 250px; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; user-select: none; }
  #pet { position: relative; width: 230px; height: 240px; display: grid; place-items: end center; cursor: default; touch-action: none; }
  #figure { width: auto; max-width: 230px; height: var(--size, 130px); margin-bottom: 53px; object-fit: contain;
    cursor: grab; animation: float 2s ease-in-out infinite; }
  #fallback { font-size: var(--size, 130px); line-height: 1; margin-bottom: 53px; cursor: grab;
    animation: float 2s ease-in-out infinite; }
  #figure:active,#fallback:active { cursor: grabbing; }
  #speech { position: absolute; bottom: calc(var(--size, 130px) + 64px); left: 50%; transform: translateX(-50%); opacity: var(--bubble-opacity, 1);
    width: max-content; max-width: 170px; max-height: 55px; overflow: hidden;
    padding: 6px 8px; border: 0; border-radius: 12px; background: #fffaf5;
    color: #4f3b31; font: 12px/1.3 sans-serif; overflow-wrap: anywhere; pointer-events: none; }
  #speech.temporary { background: #ffe5bf; }
  #speech.popping{overflow:visible;animation:pop .5s ease-out forwards}
  #speech.popping:after{content:'💥';position:absolute;left:50%;top:50%;font-size:22px;animation:burst .5s ease-out forwards}
  @keyframes pop{40%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(.5);opacity:0}}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
  #countdown { margin-left: 5px; font-weight: 700; color: #b4513d; }
  #chatButton { position: absolute; bottom: calc(var(--size, 130px) + 29px); left: calc(50% + var(--size, 130px) / 2 + 2px); width: 24px; height: 22px;
    border: 0; border-radius: 12px; background: #fffaf5; opacity: var(--chat-opacity, .7); color: #4f3b31;
    font: bold 12px sans-serif; line-height: 14px; cursor: pointer; }
  #glowButton { position:absolute;bottom:calc(var(--size,130px) + 17px);left:calc(50% + var(--size,130px) / 2 + 10px);width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#e9cc9c;opacity:var(--chat-opacity,.7);cursor:pointer }
  #pet.glowing #figure,#pet.glowing #fallback{filter:brightness(1.35) drop-shadow(0 0 8px var(--glow-color,#ffe156)) drop-shadow(0 0 17px var(--glow-color,#ffe156)) drop-shadow(0 0 28px var(--glow-color,#ffe156))}
  #pet.shaking #figure,#pet.shaking #fallback{animation:shake .24s linear 1}
  #pet.highfive:after{content:'🙌';position:absolute;bottom:calc(var(--size,130px) + 55px);left:50%;transform:translateX(-50%);font-size:26px;pointer-events:none;animation:highfive 1.2s ease-out forwards}
  @keyframes highfive{to{opacity:0;transform:translate(-50%,-28px)}}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #workStatus { position: absolute; bottom: 39px; left: 0; right: 0; text-align: center; color: #4f3b31;
    font: 11px/1.3 sans-serif; pointer-events: none; }
  [hidden] { display: none !important; }
  @keyframes float { 50% { transform: translateY(-4px) rotate(1deg); } }
</style>
<div id="pet" aria-label="캐릭터: 클릭하면 체크리스트">
  <div id="speech" hidden><span id="speechText"></span><span id="countdown" hidden></span></div>
  <button id="chatButton" type="button" aria-label="한마디 입력">···</button>
  <button id="glowButton" type="button" aria-label="여기 보세요! 빛나기" title="여기 보세요!"></button>
  <img id="figure" alt="내 캐릭터" draggable="false" hidden>
  <div id="fallback">🐻</div>
  <div id="workStatus"></div>
</div>
<script>
  const petElement = document.querySelector('#pet');
  const image = document.querySelector('#figure');
  const fallback = document.querySelector('#fallback');
  const speech = document.querySelector('#speech');
  const speechText = document.querySelector('#speechText');
  const countdown = document.querySelector('#countdown');
  const chatButton = document.querySelector('#chatButton');
  const status = document.querySelector('#workStatus');
  let baseImage = null, poses = [], poseIndex = 0, poseIntervalSeconds = 0, poseTimer, poseActive = false;
  let expiresAt = 0;
  function updateCountdown() {
    const seconds = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
    countdown.hidden = !seconds;
    countdown.textContent = seconds ? String(seconds) : '';
    if (expiresAt && !seconds) speech.classList.add('popping');
  }
  function render(data) {
    document.documentElement.style.setProperty('--size', `${data.size}px`);
    document.documentElement.style.setProperty('--bubble-opacity', Number(data.bubbleOpacity ?? 100) / 100);
    document.documentElement.style.setProperty('--chat-opacity', Number(data.bubbleOpacity ?? 100) / 100 * .7);
    document.documentElement.style.setProperty('--glow-color', data.glowColor || '#ffe156');
    const nextPoses = (data.poses || []).map(pose => pose.url);
    if (baseImage !== data.image || poses.join('|') !== nextPoses.join('|')) {
      poseIndex = 0;
      poseActive = false;
    }
    baseImage = data.image;
    poses = nextPoses;
    const seconds = Math.max(2, Math.min(12, Number(data.poseIntervalSeconds) || 8));
    if (seconds !== poseIntervalSeconds) {
      poseIntervalSeconds = seconds;
      clearInterval(poseTimer);
      poseTimer = setInterval(showNextPose, seconds * 1000);
    }
    image.hidden = !baseImage;
    fallback.hidden = !!baseImage;
    if (baseImage && !poseActive && image.src !== baseImage) image.src = baseImage;
    speechText.textContent = data.speech || '';
    speech.hidden = !data.speech;
    if (expiresAt !== (data.speechExpiresAt || 0)) speech.classList.remove('popping');
    expiresAt = data.speechExpiresAt || 0;
    speech.classList.toggle('temporary', !!expiresAt);
    updateCountdown();
    status.textContent = data.workStatus || '';
  }
  setInterval(updateCountdown, 200);
  function showNextPose() {
    if (!baseImage || !poses.length) return;
    poseActive = poseIndex < poses.length;
    image.src = poseActive ? poses[poseIndex++] : baseImage;
    if (!poseActive) poseIndex = 0;
  }
  window.pet.load().then(render);
  window.pet.onChange(render);
  document.addEventListener('dragstart', event => event.preventDefault());
  for (const figure of [image, fallback]) {
    figure.addEventListener('pointerenter', () => window.pet.hover(true));
    figure.addEventListener('pointerleave', () => window.pet.hover(false));
  }
  let last, moved;
  petElement.addEventListener('pointerdown', event => {
    if (event.button !== 0 || ![image, fallback].includes(event.target)) return;
    last = { x: event.screenX, y: event.screenY };
    moved = false;
    window.pet.dragStart();
    window.pet.hover(true);
  });
  petElement.addEventListener('pointermove', event => {
    if (!last) return;
    const dx = event.screenX - last.x, dy = event.screenY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) {
      if (!moved) petElement.setPointerCapture(event.pointerId);
      moved = true;
      window.pet.drag(dx, dy);
    }
  });
  petElement.addEventListener('pointerup', () => { last = null; window.pet.dragEnd(); });
  petElement.addEventListener('pointercancel', () => { last = null; window.pet.dragEnd(); });
  petElement.addEventListener('click', event => { if (!moved && [image, fallback].includes(event.target)) window.pet.togglePanel(); });
  chatButton.addEventListener('pointerdown', event => event.stopPropagation());
  chatButton.addEventListener('click', event => {
    event.stopPropagation();
    window.pet.toggleChat();
  });
  document.querySelector('#glowButton').addEventListener('pointerdown',event=>event.stopPropagation());
  document.querySelector('#glowButton').addEventListener('click',event=>{event.stopPropagation();window.pet.glow()});
  window.pet.onReaction(value=>{const name=value==='glow'?'glowing':value==='highfive'?'highfive':'shaking';petElement.classList.remove(name);void petElement.offsetWidth;petElement.classList.add(name);setTimeout(()=>petElement.classList.remove(name),1200)});
</script>
</html>
