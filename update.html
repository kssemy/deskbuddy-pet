<!doctype html><html lang="ko"><meta charset="utf-8">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#49362d;font:12px system-ui,sans-serif}#card{margin:4px;padding:8px;background:#fffaf5;border-radius:12px;box-shadow:0 2px 8px #735a3633}#top{display:flex;align-items:center;justify-content:space-between}strong{font-size:12px}button{border:0;border-radius:6px;background:#ffe6ac;color:#49362d;cursor:pointer;font:11px system-ui,sans-serif;padding:4px 6px}#later{background:transparent}</style>
<div id="card"><div id="top"><strong id="message"></strong><button id="later" type="button" aria-label="닫기">×</button></div><button id="restart" type="button">업데이트 후 재시작</button></div>
<script>
const query=new URLSearchParams(location.search),mac=query.get('mac')==='1',done=query.get('done')==='1';
const button=document.querySelector('#restart');
document.querySelector('#message').textContent=done?'v'+query.get('version')+' 업데이트 완료!':'새 버전 '+query.get('version')+'이 있어요';
button.hidden=done;
if(mac&&!done)button.textContent='맥용 파일 다운로드';
document.querySelector('#later').onclick=()=>window.pet.dismissUpdate();
button.onclick=async()=>{button.disabled=true;button.textContent='업데이트 중…';try{await window.pet.applyAvailableUpdate()}finally{button.disabled=false;button.textContent=mac?'맥용 파일 다운로드':'업데이트 후 재시작'}};
</script></html>
