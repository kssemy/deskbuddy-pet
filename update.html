<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#49362d;font:12px system-ui,sans-serif}#card{margin:4px;padding:8px;background:#fffaf5;border-radius:12px;box-shadow:0 2px 8px #735a3633}#top{display:flex;align-items:center;justify-content:space-between}strong{font-size:12px}button{border:0;border-radius:6px;background:#ffe6ac;color:#49362d;cursor:pointer;font:11px system-ui,sans-serif;padding:4px 6px}#later{background:transparent}</style><div id="card"><div id="top"><strong id="message"></strong><button id="later" type="button" aria-label="나중에">×</button></div><button id="restart" type="button">업데이트 후 재시작</button></div><script>document.querySelector('#message').textContent='새 버전 '+new URLSearchParams(location.search).get('version')+'이 있어요';document.querySelector('#later').onclick=()=>window.pet.dismissUpdate();document.querySelector('#restart').onclick=async()=>{const button=document.querySelector('#restart');button.disabled=true;button.textContent='업데이트 중…';try{await window.pet.applyAvailableUpdate()}finally{button.disabled=false;button.textContent='업데이트 후 재시작'}}</script></html>
