<!doctype html><html lang="ko"><meta charset="utf-8"><title>캐릭터 말풍선</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{color:#49362d;font:12px system-ui,sans-serif}
#bubble{position:relative;height:calc(100% - 16px);margin:8px;padding:12px;background:#fffaf5;opacity:var(--bubble-opacity,1);border-radius:17px}#bubble:after{content:'';position:absolute;left:calc(50% - 9px);bottom:-9px;width:18px;height:18px;background:#fffaf5;transform:rotate(45deg)}body.below #bubble:after{bottom:auto;top:-9px}
header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:14px}button{border:0;border-radius:7px;background:#ffe6ac;color:#49362d;padding:5px 7px;cursor:pointer;font:inherit}.close{background:transparent;font-size:18px;padding:0 4px}input[type=text],input[type=time]{min-width:0;border:1px solid #dbc8b9;border-radius:7px;padding:5px;font:inherit}[hidden]{display:none!important}
#tasksView{height:100%;display:flex;flex-direction:column}#tasks{flex:1;min-height:0;overflow-y:auto;list-style:none;padding:0;margin:7px 0}#tasks li,#memos li{display:flex;align-items:center;gap:5px;padding:3px 0;overflow-wrap:anywhere}#tasks li span,#memos li span{flex:1}#tasks li.done span{color:#9a8a81;text-decoration:line-through}#tasks li button,#memos li button{padding:0 4px;background:transparent;color:#9a8a81}button.pin{font-size:12px;opacity:.35;filter:grayscale(1)}button.pin.active{opacity:.85;filter:none}#memoSection{border-top:1px solid #d9c7b9;height:80px;flex:none;overflow-y:auto}#memoSection strong{display:block;margin-top:4px;font-size:10px;color:#8b7162}#memos{list-style:none;padding:0;margin:0}#add{margin-top:auto}#entry{display:block;width:100%}.actions{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}#shareRow{display:flex;margin:6px 0 4px;align-items:center;justify-content:flex-end;gap:4px;font-size:9px;line-height:1.1;color:#8b7162;text-align:right}#shareRow input{margin:0 2px 0 0}
#chatView{display:flex;align-items:center;height:100%}#chatForm{display:flex;gap:4px;width:100%}#chatInput{flex:1}#chatForm button{border-radius:50%;width:28px;height:28px;padding:0;font-size:16px}#settingsView{height:100%;overflow-y:auto}.setting{display:flex;align-items:center;gap:8px;margin-top:13px}.setting label{min-width:50px}#size{flex:1;min-width:0}#settingsView input[type=time]{width:100px}#saveSettings{margin-top:15px;width:100%}#poseList{margin:5px 0;padding:0;list-style:none;max-height:120px;overflow-y:auto}#poseList img{width:26px;height:26px;object-fit:contain}#poseList .frames{display:flex;gap:2px;margin-left:auto}#poseList li{display:flex;align-items:center;justify-content:space-between;padding:2px 0}#poseList button{background:transparent}#remoteSection{border-top:1px solid #d9c7b9;margin-top:12px;padding-top:9px}#remoteSection h2{font-size:12px;margin:0 0 6px}#loginForm{display:flex;flex-wrap:wrap;gap:4px}#loginForm input{width:70px;flex:1}#connection{display:block;margin:5px 0;overflow-wrap:anywhere}
</style>
<div id="bubble">
<section id="tasksView" hidden><header><h1 id="title"></h1><button class="close" type="button">×</button></header><label id="shareRow"><span>친구에게<br>TO DO 보이기</span><input id="shareTodos" type="checkbox"></label><ul id="tasks"></ul><div id="memoSection"><strong>고정 메모</strong><ul id="memos"></ul></div><form id="add"><input id="entry" type="text" maxlength="200" placeholder="할 일이나 메모 입력"><div class="actions"><button type="submit" value="task">할 일</button><button type="submit" value="memo">메모</button></div></form></section>
<section id="chatView" hidden><form id="chatForm"><input id="chatInput" type="text" maxlength="80" placeholder="한마디 입력"><button type="submit" title="계속 표시">↑</button><button id="bomb" type="button" title="10초 뒤 지우기">💣</button></form></section>
<section id="settingsView" hidden><header><h1>캐릭터 설정</h1><button class="close" type="button">×</button></header><div class="setting"><button id="upload" type="button">기본 PNG 올리기</button></div><div class="setting"><button id="addPoses" type="button">+ 동작 PNG 추가</button></div><div class="setting"><button id="openWardrobe" type="button">캐릭터 옷장</button></div><ul id="poseList"></ul><div class="setting"><label for="size">모두 크기</label><input id="size" type="range" min="80" max="170" step="5"><span id="sizeValue"></span></div><div class="setting"><label for="opacity">불투명도</label><input id="opacity" type="range" min="30" max="100" step="5"><span id="opacityValue"></span></div><div class="setting"><label for="workStart">출근</label><input id="workStart" type="time"></div><div class="setting"><label for="workEnd">퇴근</label><input id="workEnd" type="time"></div><div class="setting"><label for="lunchStart">점심 시작</label><input id="lunchStart" type="time"></div><div class="setting"><label for="lunchEnd">점심 끝</label><input id="lunchEnd" type="time"></div><div class="setting"><label for="completedTodos">완료한 할 일</label><select id="completedTodos"><option value="bottom">아래로 이동</option><option value="hide">목록에서 숨기기</option></select></div><div class="setting"><label for="followMouse">마우스 따라오기</label><input id="followMouse" type="checkbox"></div><div class="setting"><label for="alwaysOnTop">항상 위에 표시</label><input id="alwaysOnTop" type="checkbox"></div><div class="setting"><label for="autoLaunch">컴퓨터 켤 때 자동 실행</label><input id="autoLaunch" type="checkbox"></div><div id="remoteSection"><h2>함께 일하기 · 캐릭터 앱</h2><span id="connection"></span><form id="loginForm"><input id="loginName" type="text" maxlength="12" placeholder="닉네임" aria-label="캐릭터 앱 닉네임"><input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 6자리" aria-label="캐릭터 앱 PIN"><button type="submit">로그인</button><button id="register" type="button">처음 가입</button></form><button id="disconnect" type="button" hidden>연결 해제</button></div><button id="saveSettings" type="button">저장</button><div class="setting"><button id="openHistory" type="button">이번 달 한 일 보기</button></div><div class="setting"><button id="checkUpdate" type="button">최신 버전 확인하기</button></div><p id="updateStatus" role="status"></p><button id="openRelease" type="button" hidden>새 버전 다운로드</button></section>
</div>
<script>
const params=new URLSearchParams(location.search),mode=params.get('mode')||'tasks';
document.body.classList.toggle('below',params.get('placement')==='below');
document.querySelector('#'+mode+'View').hidden=false;
const dayKey=()=>{const date=new Date();return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')};
let day=dayKey();
let tasks=[],memos=[],firstRender=true;
function render(data){
 day=dayKey();const today=new Date();document.querySelector('#title').textContent=(today.getMonth()+1)+'월 '+today.getDate()+'일 TO DO';
 document.documentElement.style.setProperty('--bubble-opacity',Number(data.bubbleOpacity??100)/100);
 tasks=data.tasks||[];memos=data.memos||[];
 const taskList=document.querySelector('#tasks');taskList.replaceChildren();
 function addTask(task){
  const li=document.createElement('li');li.className=task.done?'done':'';
  const check=document.createElement('input');check.type='checkbox';check.checked=task.done;
  check.addEventListener('change',()=>window.pet.setTasks(tasks.map(item=>item.id===task.id?{...item,done:check.checked,completedAt:check.checked?day:''}:item)));
  const label=document.createElement('span');label.textContent=task.text;
  const pin=document.createElement('button');pin.type='button';pin.className='pin'+(task.pinned?' active':'');pin.textContent='📌';pin.title=task.pinned?'고정 해제':'고정 할 일로 이동';pin.setAttribute('aria-label',pin.title);pin.setAttribute('aria-pressed',String(!!task.pinned));
  pin.addEventListener('click',()=>window.pet.setTasks(tasks.map(item=>item.id===task.id?{...item,pinned:!task.pinned}:item)));
  const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.title='삭제';
  remove.addEventListener('click',()=>window.pet.setTasks(tasks.filter(item=>item.id!==task.id)));
  li.append(check,label,pin,remove);taskList.append(li);
 }
 for(const task of tasks.filter(item=>item.pinned).sort((a,b)=>Number(a.done)-Number(b.done)))addTask(task);
 for(const task of tasks.filter(item=>!item.pinned&&(!item.done||item.completedAt===day)).filter(item=>data.completedTodos!=='hide'||!item.done).sort((a,b)=>Number(a.done)-Number(b.done)))addTask(task);
 const memoList=document.querySelector('#memos');memoList.replaceChildren();
 for(const memo of memos){const li=document.createElement('li'),label=document.createElement('span'),remove=document.createElement('button');label.textContent=memo.text;remove.type='button';remove.textContent='×';remove.title='삭제';remove.addEventListener('click',()=>window.pet.setMemos(memos.filter(item=>item.id!==memo.id)));li.append(label,remove);memoList.append(li)}
 const poseList=document.querySelector('#poseList');poseList.replaceChildren();
 const allPoses=data.poses||[],poseByName=new Map(allPoses.map(pose=>[pose.name,pose])),grouped=new Set();
 for(const set of data.poseSets||[]){const poses=set.names.map(name=>poseByName.get(name)).filter(Boolean);if(!poses.length)continue;set.names.forEach(name=>grouped.add(name));const li=document.createElement('li'),label=document.createElement('span'),frames=document.createElement('span'),remove=document.createElement('button');label.textContent=set.label+' · 3종';frames.className='frames';for(const pose of poses){const img=document.createElement('img');img.src=pose.url;img.alt=set.label;frames.append(img)}remove.type='button';remove.textContent='×';remove.title='동작 세트 삭제';remove.addEventListener('click',async()=>render(await window.pet.removePoseSet(set.id)));li.append(label,frames,remove);poseList.append(li)}
 for(const [index,pose] of allPoses.entries()){if(grouped.has(pose.name))continue;const li=document.createElement('li'),label=document.createElement('span'),remove=document.createElement('button');label.textContent='동작 '+(index+1);remove.type='button';remove.textContent='×';remove.title='동작 PNG 삭제';remove.addEventListener('click',async()=>render(await window.pet.removePose(pose.name)));li.append(label,remove);poseList.append(li)}
 const size=document.querySelector('#size');if(document.activeElement!==size)size.value=data.size;
 document.querySelector('#sizeValue').textContent=size.value+'px';
 const opacity=document.querySelector('#opacity');if(document.activeElement!==opacity)opacity.value=data.bubbleOpacity??100;
 document.querySelector('#opacityValue').textContent=opacity.value+'%';
 for(const key of ['workStart','workEnd','lunchStart','lunchEnd','followMouse','alwaysOnTop','autoLaunch']){const input=document.querySelector('#'+key);if(document.activeElement!==input)input.type==='checkbox'?input.checked=data[key]:input.value=data[key]}
 document.querySelector('#completedTodos').value=data.completedTodos||'bottom';
 document.querySelector('#shareTodos').checked=!!data.shareTodos;
 const remote=data.remote||{};document.querySelector('#connection').textContent=remote.error||(remote.connected?remote.name+' · 연결됨 · '+(remote.checked?(remote.friendCount?`친구 ${remote.friendCount}명 접속 중`:'나만 접속 중'):'친구 확인 중…'):'연결 전');
 document.querySelector('#loginForm').hidden=!!remote.connected;document.querySelector('#disconnect').hidden=!remote.connected;
 const chatInput=document.querySelector('#chatInput');if(firstRender||document.activeElement!==chatInput)chatInput.value=data.speech||'';
 if(mode==='tasks')requestAnimationFrame(()=>{const total=[...taskList.children].reduce((sum,item)=>sum+item.getBoundingClientRect().height,0);window.pet.resizePanel(300+Math.max(0,total-75))});
 firstRender=false;
}
window.pet.load().then(render);window.pet.onChange(render);
document.querySelectorAll('.close').forEach(button=>button.addEventListener('click',()=>window.close()));
document.addEventListener('keydown',event=>{if(event.key==='Escape')window.close()});
document.querySelector('#add').addEventListener('submit',async event=>{event.preventDefault();const input=document.querySelector('#entry'),text=input.value.trim();if(!text)return;if(event.submitter?.value==='memo')await window.pet.setMemos([...memos,{id:crypto.randomUUID(),text}]);else await window.pet.setTasks([...tasks,{id:crypto.randomUUID(),text,done:false,pinned:false,day,completedAt:''}]);input.value='';input.focus()});
document.querySelector('#shareTodos').addEventListener('change',event=>window.pet.setShareTodos(event.target.checked));
document.querySelector('#chatForm').addEventListener('submit',async event=>{event.preventDefault();await window.pet.setSpeech(document.querySelector('#chatInput').value,false);window.close()});
document.querySelector('#bomb').addEventListener('click',async()=>{await window.pet.setSpeech(document.querySelector('#chatInput').value,true);window.close()});
document.querySelector('#upload').addEventListener('click',async()=>{try{render(await window.pet.chooseImage())}catch(error){alert(error.message)}});
document.querySelector('#addPoses').addEventListener('click',async()=>{try{render(await window.pet.addPoses())}catch(error){alert(error.message)}});
async function connectPet(register){const pin=document.querySelector('#loginPin');try{render(await window.pet.connectPet(document.querySelector('#loginName').value,pin.value,register));pin.value=''}catch(error){document.querySelector('#connection').textContent=error.message;pin.value=''}}
document.querySelector('#loginForm').addEventListener('submit',event=>{event.preventDefault();connectPet(false)});
document.querySelector('#register').addEventListener('click',()=>connectPet(true));
document.querySelector('#disconnect').addEventListener('click',async()=>render(await window.pet.disconnectPet()));
document.querySelector('#openHistory').addEventListener('click',()=>window.pet.openHistory());
document.querySelector('#openWardrobe').addEventListener('click',()=>window.pet.openWardrobe());
document.querySelector('#checkUpdate').addEventListener('click',async()=>{const status=document.querySelector('#updateStatus'),button=document.querySelector('#openRelease');status.textContent='확인 중…';button.hidden=true;try{const result=await window.pet.checkUpdate();status.textContent=result.update?`새 버전 ${result.latest}이 있어요.`:`최신 버전이에요 (${result.current}).`;button.hidden=!result.update}catch(error){status.textContent=error.message}});
document.querySelector('#openRelease').textContent='업데이트 후 실행';
document.querySelector('#openRelease').addEventListener('click',async()=>{document.querySelector('#updateStatus').textContent='다운로드 중… 잠시만 기다려 주세요.';try{await window.pet.installUpdate()}catch(error){document.querySelector('#updateStatus').textContent=error.message}});
document.querySelector('#size').addEventListener('input',event=>{document.querySelector('#sizeValue').textContent=event.target.value+'px';window.pet.setSize(event.target.value)});
document.querySelector('#opacity').addEventListener('input',event=>{document.querySelector('#opacityValue').textContent=event.target.value+'%';document.documentElement.style.setProperty('--bubble-opacity',Number(event.target.value)/100);window.pet.setOpacity(event.target.value)});
document.querySelector('#saveSettings').addEventListener('click',async()=>{try{await window.pet.setSettings({size:document.querySelector('#size').value,workStart:document.querySelector('#workStart').value,workEnd:document.querySelector('#workEnd').value,lunchStart:document.querySelector('#lunchStart').value,lunchEnd:document.querySelector('#lunchEnd').value,completedTodos:document.querySelector('#completedTodos').value,followMouse:document.querySelector('#followMouse').checked,alwaysOnTop:document.querySelector('#alwaysOnTop').checked,autoLaunch:document.querySelector('#autoLaunch').checked});window.close()}catch(error){alert(error.message)}});
if(mode==='chat')document.querySelector('#chatInput').focus();
</script></html>
